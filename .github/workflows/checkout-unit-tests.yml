name: TimeEase Checkout Unit Tests
on:
  push:
    branches: [fix/intake-checkout-readiness-audit]
    paths:
      - 'lib/upload-first-pricing.ts'
      - 'lib/shopify-paid-order-reconciliation.ts'
      - 'lib/shopify-webhook-auth.ts'
      - 'lib/checkout-readiness.ts'
      - 'tests/checkout-reconciliation.test.ts'
      - 'tests/shopify-webhook-auth.test.ts'
      - '.github/workflows/checkout-unit-tests.yml'
  pull_request:
    paths:
      - 'lib/upload-first-pricing.ts'
      - 'lib/shopify-paid-order-reconciliation.ts'
      - 'lib/checkout-readiness.ts'
      - 'tests/checkout-reconciliation.test.ts'
      - 'tests/shopify-webhook-auth.test.ts'
      - '.github/workflows/checkout-unit-tests.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Repository does not yet contain package-lock.json; npm ci would always fail.
      - name: Install dependencies without writing a lockfile
        run: npm install --no-package-lock --ignore-scripts
      - name: Type-check and run isolated reconciliation tests
        run: |
          mkdir -p /tmp/timeease-checkout-tests
          ./node_modules/.bin/tsc \
            --target es2022 --module commonjs --moduleResolution node --esModuleInterop \
            --skipLibCheck --types node --outDir /tmp/timeease-checkout-tests \
            lib/upload-first-pricing.ts lib/checkout-readiness.ts \
            lib/shopify-paid-order-reconciliation.ts lib/shopify-webhook-auth.ts \
            tests/checkout-reconciliation.test.ts tests/shopify-webhook-auth.test.ts
          node --test /tmp/timeease-checkout-tests/tests/*.test.js
