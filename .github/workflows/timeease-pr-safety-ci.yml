name: TimeEase PR Safety CI
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  typecheck-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Reuse accepted Preview evidence only for unchanged core
        run: git diff --exit-code 4e656ac5092668c6474290dd15ac1e92209581ee HEAD -- lib/v2-delivery-outbox.ts lib/paid-job-claim.ts lib/preview-order-fixture.ts app/api/test-worker/order-e2e/route.ts tests/v2-delivery-outbox.test.mjs 'lib/preview-*.ts' lib/test-worker-guards.ts lib/worker-database.ts lib/blob-access.ts
      - name: Production P0 changed integration tests (no external services)
        run: node --test tests/production-p0.test.mjs tests/shopify-paid-webhook.test.mjs
      - name: Changed checkout release gate test
        run: node --test --test-name-pattern='production launch stays blocked' tests/production-launch-guards.test.mjs
      - name: Changed formal Preview pending gate test
        run: node --test --test-name-pattern='formal Preview pending' tests/worker-database.test.mjs
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Production build
        run: npm run build
