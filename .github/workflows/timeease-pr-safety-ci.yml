name: TimeEase PR Safety CI
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  typecheck-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Reuse accepted Preview evidence only for unchanged core
        run: git diff --exit-code 4e656ac5092668c6474290dd15ac1e92209581ee HEAD -- lib/v2-delivery-outbox.ts lib/paid-job-claim.ts tests/v2-delivery-outbox.test.mjs 'lib/preview-*.ts' lib/test-worker-guards.ts lib/worker-database.ts lib/blob-access.ts ':(exclude)lib/preview-shopify-reversal.ts' ':(exclude)lib/preview-mock-delivery.ts' ':(exclude)lib/preview-order-fixture.ts'
      - name: Reuse unchanged Production payment and release guards
        run: git diff --exit-code 3fcda0a30bb13e3f07e1ae65d656fc1ee2c38051 HEAD -- app lib/production-release.ts lib/payment-reversal.ts lib/paid-order-ledger.ts lib/shopify-payment-state.ts lib/checkout-readiness.ts lib/payment-ledger-schema-ready.ts lib/worker-database.ts ':(exclude)app/api/test-worker/shopify-reversal/route.ts' ':(exclude)app/api/test-worker/order-e2e/route.ts' ':(exclude)app/api/worker/delivery-artifact/route.ts'
      - name: Reuse accepted delivery and sender evidence only for unchanged sources
        run: git diff --exit-code a4d31a94d9e06640ab5e20371f9892387a9a8add HEAD -- lib/production-delivery.ts tests/production-p0.test.mjs lib/n8n-outbox-contract.mjs tests/n8n-outbox-contract.test.mjs scripts/build-n8n-preview-contract.mjs workflows/preview-outbox-contract.sdk.js
      - name: Reuse accepted payment URL separation evidence
        run: git diff --exit-code 607b4b3395001c97c219f880c91631d88819965e HEAD -- lib/production-database.ts tests/payment-url-purpose.test.mjs
      - name: Reuse accepted reversal ingress evidence
        run: git diff --exit-code 546f00ac4eeda0e45c22fa755669fd8178f64533 HEAD -- lib/preview-shopify-reversal.ts app/api/test-worker/shopify-reversal/route.ts tests/preview-reversal-ingress.test.mjs
      - name: Reuse accepted mock-receipt evidence
        run: git diff --exit-code 97bf29d8fef352d80a0eb678e8380b44d45a67a0 HEAD -- lib/preview-mock-delivery.ts lib/preview-order-fixture.ts tests/preview-mock-receipt.test.mjs
      - name: Reuse accepted persisted-read and binary contracts
        run: git diff --exit-code 66696c8996fa1fa9347377efa103df83562950e4 HEAD -- lib/persisted-delivery-artifact.ts lib/n8n-persisted-artifact.mjs tests/persisted-delivery-artifact.test.mjs tests/n8n-persisted-artifact.test.mjs
      - name: Reuse accepted isolated download evidence
        run: git diff --exit-code 2c17851aa8eae522793e8ba5231d25a982c31ad2 HEAD -- app/api/worker/delivery-artifact/route.ts app/api/test-worker/order-e2e/route.ts lib/isolated-delivery-fixtures.ts tests/isolated-delivery-acceptance.test.mjs
      - name: Verify protected stable alias and exact commit binding only
        run: node --test tests/isolated-preview-alias.test.mjs
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Production build
        run: npm run build
