<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d">
<title id="t">Purchase Order PDF to Excel workflow</title>
<desc id="d">A purchase order PDF is transformed into structured PO fields, line items and review flags, then exported to Excel or CSV.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#f5f8ff"/></linearGradient>
  <filter id="s" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#101828" flood-opacity=".08"/></filter>
</defs>
<rect width="1600" height="900" rx="48" fill="url(#bg)"/>
<g filter="url(#s)">
  <rect x="70" y="150" width="450" height="540" rx="30" fill="#fff" stroke="#e6eaf0"/>
  <rect x="1080" y="150" width="450" height="540" rx="30" fill="#fff" stroke="#e6eaf0"/>
</g>
<rect x="105" y="185" width="74" height="86" rx="12" fill="#ef4444"/>
<text x="142" y="236" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#fff">PDF</text>
<text x="105" y="325" font-family="Arial,sans-serif" font-size="30" font-weight="800" fill="#101828">PURCHASE ORDER</text>
<text x="105" y="374" font-family="Arial,sans-serif" font-size="18" fill="#475467">Vendor</text>
<text x="105" y="404" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#101828">Acme Supplies Co.</text>
<text x="330" y="374" font-family="Arial,sans-serif" font-size="18" fill="#475467">PO Number</text>
<text x="330" y="404" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#101828">PO-10458</text>
<line x1="105" y1="446" x2="485" y2="446" stroke="#eaecf0"/>
<g font-family="Arial,sans-serif" font-size="16" fill="#344054">
  <text x="105" y="486" font-weight="700">Item</text><text x="190" y="486" font-weight="700">Description</text><text x="380" y="486" font-weight="700">Qty</text>
  <text x="105" y="526">001</text><text x="190" y="526">Office Chair</text><text x="380" y="526">10</text>
  <text x="105" y="566">002</text><text x="190" y="566">Monitor 27"</text><text x="380" y="566">5</text>
  <text x="105" y="606">003</text><text x="190" y="606">Keyboard</text><text x="380" y="606">20</text>
</g>
<text x="295" y="750" text-anchor="middle" font-family="Arial,sans-serif" font-size="26" font-weight="800" fill="#101828">Purchase Order PDF</text>
<path d="M550 405 H665" stroke="#4f7cff" stroke-width="5" stroke-linecap="round" stroke-dasharray="9 12"/><path d="M650 387 L674 405 L650 423" fill="none" stroke="#4f7cff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="685" y="235" width="230" height="190" rx="38" fill="#edf3ff" stroke="#d7e3ff"/>
<ellipse cx="800" cy="300" rx="52" ry="19" fill="#7ba2ff"/><path d="M748 300v58c0 11 23 20 52 20s52-9 52-20v-58" fill="#7ba2ff" opacity=".8"/><ellipse cx="800" cy="358" rx="52" ry="19" fill="#6f96f1"/>
<circle cx="855" cy="365" r="30" fill="#fff"/><text x="855" y="376" text-anchor="middle" font-family="Arial,sans-serif" font-size="28" fill="#4f7cff">✦</text>
<g font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#101828">
  <rect x="660" y="470" width="280" height="72" rx="20" fill="#fff" stroke="#e7eaf0"/><text x="800" y="515" text-anchor="middle">PO fields</text>
  <rect x="660" y="558" width="280" height="72" rx="20" fill="#fff" stroke="#e7eaf0"/><text x="800" y="603" text-anchor="middle">Line items</text>
  <rect x="660" y="646" width="280" height="72" rx="20" fill="#fff" stroke="#e7eaf0"/><text x="800" y="691" text-anchor="middle">Review flags</text>
</g>
<path d="M950 405 H1050" stroke="#4f7cff" stroke-width="5" stroke-linecap="round" stroke-dasharray="9 12"/><path d="M1035 387 L1059 405 L1035 423" fill="none" stroke="#4f7cff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="1115" y="190" width="60" height="60" rx="12" fill="#198754"/><text x="1145" y="231" text-anchor="middle" font-family="Arial,sans-serif" font-size="32" font-weight="800" fill="#fff">X</text>
<text x="1455" y="228" text-anchor="end" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#344054">Excel / CSV</text>
<line x1="1115" y1="276" x2="1495" y2="276" stroke="#eaecf0"/>
<g font-family="Arial,sans-serif" font-size="15" fill="#344054">
  <text x="1125" y="318" font-weight="700">PO Number</text><text x="1240" y="318" font-weight="700">Vendor</text><text x="1368" y="318" font-weight="700">Item</text><text x="1437" y="318" font-weight="700">Qty</text>
  <text x="1125" y="362">PO-10458</text><text x="1240" y="362">Acme Supplies</text><text x="1368" y="362">001</text><text x="1437" y="362">10</text>
  <text x="1125" y="406">PO-10458</text><text x="1240" y="406">Acme Supplies</text><text x="1368" y="406">002</text><text x="1437" y="406">5</text>
  <text x="1125" y="450">PO-10458</text><text x="1240" y="450">Acme Supplies</text><text x="1368" y="450">003</text><text x="1437" y="450">20</text>
</g>
<g fill="#eef2f6"><rect x="1120" y="505" width="340" height="18" rx="9"/><rect x="1120" y="542" width="290" height="18" rx="9"/><rect x="1120" y="579" width="320" height="18" rx="9"/></g>
<text x="1305" y="750" text-anchor="middle" font-family="Arial,sans-serif" font-size="26" font-weight="800" fill="#101828">Excel / CSV</text>
</svg>